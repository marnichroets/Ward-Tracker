name: Ward Tracker development checks

on:
  push:
    branches:
      - dev/pho-premium-upgrade
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Synthetic test configuration only. No Railway, Vercel or MongoDB
    # production credentials are used by this workflow.
    env:
      MONGO_URI: mongodb://127.0.0.1:27017
      DB_NAME: ward_tracker_test
      ADMIN_PIN: local-test-pin-not-for-production
      JWT_SECRET: local-test-secret-not-for-production-only-1234567890123456
      COORDINATOR_LEADER_PIN: local-test-leader-pin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt pytest 'httpx==0.27.2'
      - name: Full backend regression suite (synthetic fixtures)
        run: python -m pytest -q
      - name: All frontend tests
        run: |
          for testfile in frontend/*.test.js; do
            node "$testfile"
          done
